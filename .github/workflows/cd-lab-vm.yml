name: CD - Lab VM

on:
  workflow_run:
    workflows: ["CI - Backend"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  # 2) PUBLISH: only if "CI - Backend" (tests + Quality Gate) passed on a push to main
  publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ vars.DOCKERHUB_USERNAME }}/neurozen-backend:sha-${{ github.event.workflow_run.head_sha }}

      - id: digest
        env:
          DOCKER_USER: ${{ vars.DOCKERHUB_USERNAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=${DOCKER_USER}/neurozen-backend@${DIGEST}" >> "$GITHUB_OUTPUT"

  # 3) DEPLOY: candidate on 18080, promoted to 8080 only if /health is OK
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: lab-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Copy deploy script to VM
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ~/neurozen"
          scp -o StrictHostKeyChecking=yes scripts/deploy.sh "${DEPLOY_USER}@${DEPLOY_HOST}:~/neurozen/deploy.sh"

      - name: Deploy immutable image
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "bash ~/neurozen/deploy.sh '${IMAGE}'"