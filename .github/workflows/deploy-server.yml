name: NeuroZen CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Setup .NET 9
      uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.0.1
      with:
        dotnet-version: 9.0.x
    - name: Run Unit Tests
      run: dotnet test --filter "FullyQualifiedName~Unit"

  publish-and-deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment: lab-production
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push (amd64)
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/neurozen-api:sha-${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/neurozen-api:latest

    - name: Copy deployment script to AWS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        source: "scripts/deploy.sh"
        target: "~/neurozen_web_backend"

    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@v1.0.3
      env:
        IMAGE_TAG: sha-${{ github.sha }}
        DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        envs: IMAGE_TAG,DOCKER_USER,JWT_SECRET
        script: |
          chmod +x ~/neurozen_web_backend/scripts/deploy.sh
          ~/neurozen_web_backend/scripts/deploy.sh $DOCKER_USER/neurozen-api:$IMAGE_TAG "$JWT_SECRET"