name: CI - Backend

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Server-level connection: the tests create (and drop) their own database per run.
      NEUROZEN_TEST_MYSQL: "server=127.0.0.1;port=3306;user=root;password=root"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore dependencies
        run: dotnet restore

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"Proyecto-1ASI0732-2620-Experimentos_neurozen_web_backend"
          /o:"proyecto-1asi0732-2620-experimentos"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.cs.vstest.reportsPaths="**/*.trx"
          /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs"
          /d:sonar.exclusions="**/Migrations/**,**/*.feature.cs"
          /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Unit, integration (WebApplicationFactory + MySQL 8) and BDD (Reqnroll) tests, with coverage.
      - name: Run all tests
        run: >
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura

      - name: Sonar end (Quality Gate)
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/coverage" \
            -reporttypes:"MarkdownSummaryGithub;HtmlInline" \
            -assemblyfilters:"+neurozen.API"
          cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
