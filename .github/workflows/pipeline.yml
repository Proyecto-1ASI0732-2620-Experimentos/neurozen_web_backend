name: NeuroZen CI CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1) QUALITY: build, pruebas con cobertura y Quality Gate de SonarCloud
  quality:
    runs-on: ubuntu-latest
    env:
      # Server-level connection: the tests create (and drop) their own database per run.
      NEUROZEN_TEST_MYSQL: "server=127.0.0.1;port=3306;user=root;password=root"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore dependencies
        run: dotnet restore

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"Proyecto-1ASI0732-2620-Experimentos_neurozen_web_backend"
          /o:"proyecto-1asi0732-2620-experimentos"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.cs.vstest.reportsPaths="**/*.trx"
          /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs"
          /d:sonar.exclusions="**/Migrations/**,**/*.feature.cs"
          /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Unit, integration (WebApplicationFactory + MySQL 8) and BDD (Reqnroll) tests, with coverage.
      - name: Run all tests
        run: >
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura

      - name: Sonar end (Quality Gate)
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/coverage" \
            -reporttypes:"MarkdownSummaryGithub;HtmlInline" \
            -assemblyfilters:"+neurozen.API"
          cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  # 2) PUBLISH: solo en push a main, con quality en verde; imagen inmutable por digest
  publish:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: build
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/neurozen-backend:sha-${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/neurozen-backend:latest

      - id: digest
        env:
          DOCKER_USER: ${{ vars.DOCKERHUB_USERNAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=${DOCKER_USER}/neurozen-backend@${DIGEST}" >> "$GITHUB_OUTPUT"

  # 3) DEPLOY: en el propio runner Ubuntu de GitHub (sin VM externa).
  #    Descarga la imagen por digest, levanta MySQL, candidato en 18080 -> smoke /health
  #    -> promocion a 8080 (si el smoke falla, no se promueve: rollback).
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: lab-production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare runner (MySQL + api.env)
        run: |
          docker network create neurozen-network
          docker run -d --name neurozen-mysql --network neurozen-network \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=neurozen mysql:8.0
          echo "Esperando a MySQL..."
          for i in $(seq 1 40); do
            if docker run --rm --network neurozen-network mysql:8.0 \
                 mysqladmin ping -h neurozen-mysql -uroot -proot --silent; then
              echo "MySQL listo"; break
            fi
            sleep 3
          done
          mkdir -p ~/neurozen
          cat > ~/neurozen/api.env <<EOF
          ConnectionStrings__DefaultConnection=server=neurozen-mysql;port=3306;database=neurozen;user=root;password=root
          TokenSettings__Secret=$(openssl rand -base64 48)
          Database__ServerVersion=8.0.36-mysql
          EOF
          chmod 600 ~/neurozen/api.env

      - name: Deploy immutable image (candidate -> smoke -> promote)
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          test -n "$IMAGE" || { echo "::error::publish no entrego la imagen"; exit 1; }
          bash scripts/deploy.sh "$IMAGE"

      - name: Deployment evidence
        run: |
          docker ps
          echo "Imagen activa:"
          docker inspect neurozen-backend --format '{{.Config.Image}}'
          curl -fsS http://127.0.0.1:8080/health
          {
            echo "### Despliegue"
            echo "- Imagen: \`$(docker inspect neurozen-backend --format '{{.Config.Image}}')\`"
            echo "- Health: \`$(curl -fsS http://127.0.0.1:8080/health)\`"
          } >> "$GITHUB_STEP_SUMMARY"
